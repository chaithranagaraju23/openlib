<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 380" width="520" height="380" role="img" aria-label="Four Generations Reading Together">
  <rect width="520" height="380" rx="24" fill="#F1F5F9"/>
  <circle cx="430" cy="80" r="48" fill="#FEF3C7"/>
  <circle cx="90" cy="300" r="62" fill="#E0F2FE"/>
  <!-- Bookshelf frame -->
  <rect x="70" y="70" width="380" height="230" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>
  <!-- Shelf 1 books -->
  <rect x="98" y="100" width="32" height="72" rx="4" fill="#0284C7"/>
  <rect x="136" y="110" width="28" height="62" rx="4" fill="#F59E0B"/>
  <rect x="170" y="96" width="34" height="76" rx="4" fill="#4F46E5"/>
  <rect x="210" y="108" width="26" height="64" rx="4" fill="#0D9488"/>
  <rect x="242" y="102" width="30" height="70" rx="4" fill="#1E3A5F"/>
  <rect x="284" y="116" width="136" height="56" rx="8" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="352" y="142" text-anchor="middle" fill="#1E3A5F" font-family="sans-serif" font-size="13" font-weight="700">4 Generations</text>
  <text x="352" y="159" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="11">Ages 5 to 99+</text>
  <line x1="90" y1="176" x2="430" y2="176" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round"/>
  <!-- Four generation badges -->
  <rect x="98" y="198" width="76" height="72" rx="10" fill="#E0F2FE"/>
  <text x="136" y="232" text-anchor="middle" fill="#0369A1" font-family="sans-serif" font-size="12" font-weight="700">Children</text>
  <text x="136" y="250" text-anchor="middle" fill="#0284C7" font-family="sans-serif" font-size="11">5–12 yrs</text>

  <rect x="184" y="198" width="76" height="72" rx="10" fill="#EEF2FF"/>
  <text x="222" y="232" text-anchor="middle" fill="#4338CA" font-family="sans-serif" font-size="12" font-weight="700">Youth</text>
  <text x="222" y="250" text-anchor="middle" fill="#4F46E5" font-family="sans-serif" font-size="11">13–24 yrs</text>

  <rect x="270" y="198" width="76" height="72" rx="10" fill="#F1F5F9"/>
  <text x="308" y="232" text-anchor="middle" fill="#1E3A5F" font-family="sans-serif" font-size="12" font-weight="700">Adults</text>
  <text x="308" y="250" text-anchor="middle" fill="#334155" font-family="sans-serif" font-size="11">25–59 yrs</text>

  <rect x="356" y="198" width="76" height="72" rx="10" fill="#CCFBF1"/>
  <text x="394" y="232" text-anchor="middle" fill="#0F766E" font-family="sans-serif" font-size="12" font-weight="700">Seniors</text>
  <text x="394" y="250" text-anchor="middle" fill="#0D9488" font-family="sans-serif" font-size="11">60+ yrs</text>
</svg>

